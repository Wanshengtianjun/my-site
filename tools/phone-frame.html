<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone frame</title>
  <style>
    html, body { margin: 0; background: #ffffff; }
    iframe { display: block; width: 375px; height: 812px; border: 0; }
  </style>
</head>
<body>
  <iframe id="phone" src="../index.html" scrolling="no" title="Phone preview"></iframe>
  <script>
    var params = new URLSearchParams(window.location.search);
    var full = params.get('u');
    var page = params.get('p');
    if (full) {
      document.getElementById('phone').src = full;
    } else if (page) {
      document.getElementById('phone').src = '../' + page;
    }
  </script>
</body>
</html>
